backend:
  image:
    repository: ghcr.io/sky3117/devops-mvp-backend
    tag: latest
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO

frontend:
  image:
    repository: ghcr.io/sky3117/devops-mvp-frontend
    tag: latest
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  user: taskuser
  database: taskdb

redis:
  image: redis:7-alpine

ingress:
  enabled: true
  host: taskmanager.example.com
  apiHost: api.taskmanager.example.com
  tls: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
