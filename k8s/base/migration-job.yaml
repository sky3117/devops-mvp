apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: taskmanager
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
        - name: migrate
          image: ghcr.io/YOUR_GH_USERNAME/taskmanager-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
      restartPolicy: Never
