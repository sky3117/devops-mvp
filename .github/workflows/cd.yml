name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: img
        run: echo "name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          load: true

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Push image (sha + latest tags)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          export ID_TOKEN

          node - <<'NODE'
          const token = process.env.ID_TOKEN;
          const payload = JSON.parse(
            Buffer.from(token.split(".")[1], "base64url").toString()
          );

          console.log("OIDC sub:", payload.sub);
          console.log("OIDC aud:", payload.aud);
          console.log("OIDC repository:", payload.repository);
          console.log("OIDC repository_id:", payload.repository_id);
          console.log("OIDC repository_owner:", payload.repository_owner);
          console.log("OIDC repository_owner_id:", payload.repository_owner_id);
          console.log("OIDC environment:", payload.environment);
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::652063276755:role/GitHubActions-TaskManager
          aws-region: ap-south-1

      - name: Set up kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name dev-taskmanager-cluster

      - name: Deploy via Helm
        run: |
          helm upgrade --install taskmanager ./helm/taskmanager \
            -f ./helm/taskmanager/values-staging.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --namespace taskmanager-staging --create-namespace \
            --wait --timeout 5m

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # requires manual approval - configure protection rules in repo settings
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config

      - name: Deploy via Helm (canary-friendly rolling update)
        run: |
          helm upgrade --install taskmanager ./helm/taskmanager \
            -f ./helm/taskmanager/values-production.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --namespace taskmanager-prod --create-namespace \
            --wait --timeout 10m

      - name: Rollback on failure
        if: failure()
        run: helm rollback taskmanager --namespace taskmanager-prod
